xt-anchor="start">TenSuKien</text><text x="32" y="211" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TrangThai</text><rect x="402" y="82" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M408 82H676Q682 82 682 88V118H402V88Q402 82 408 82" fill="#164d50"/><text x="416" y="107" font-size="18" fill="white" font-weight="600" text-anchor="start">HopDong</text><text x="416" y="142" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="416" y="165" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">BTCId  FK</text><text x="416" y="188" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">SuKienId  FK?</text><text x="416" y="211" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">LoaiPhi</text><rect x="18" y="346" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M24 346H292Q298 346 298 352V382H18V352Q18 346 24 346" fill="#164d50"/><text x="32" y="371" font-size="18" fill="white" font-weight="600" text-anchor="start">DoiSoat</text><text x="32" y="406" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="32" y="429" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">SuKienId  FK</text><text x="32" y="452" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">PhienBan</text><text x="32" y="475" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TienBTCNhan</text><rect x="402" y="346" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M408 346H676Q682 346 682 352V382H402V352Q402 346 408 346" fill="#164d50"/><text x="416" y="371" font-size="18" fill="white" font-weight="600" text-anchor="start">GiaiNgan</text><text x="416" y="406" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="416" y="429" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">DoiSoatId  FK, UQ</text><text x="416" y="452" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">KhoaChongLap  UQ</text><text x="416" y="475" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">SoTien</text><text x="18" y="544" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Mỗi bản đối soát có tối đa một lệnh giải ngân.</text><text x="18" y="569" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Đối soát lưu ảnh chụp số liệu, tách phiên bản theo kỳ.</text><line x1="18" x2="682" y1="595" y2="595" stroke="#d5e2e1"/><text x="18" y="622" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">? = cho phép NULL   ·   UQ = duy nhất   ·   UQF = duy nhất có lọc</text></g></svg>