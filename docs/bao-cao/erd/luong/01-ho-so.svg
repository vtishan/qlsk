<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650"><title>Hồ sơ ban tổ chức</title><desc>Sơ đồ quan hệ dữ liệu QLSK. Bội số đặt cạnh từng bảng. Các thuộc tính lấy từ lược đồ SQL Server.</desc><rect width="700" height="650" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="18" y="30" font-size="22" fill="#164d50" font-weight="600" text-anchor="start">Hồ sơ ban tổ chức</text><text x="18" y="57" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Trích lược đồ vật lý · PK / FK · số lượng tối thiểu..tối đa</text><path d="M298,160 L402,160" fill="none" stroke="#537577" stroke-width="1.8"/><text x="320" y="147" font-size="16" fill="#164d50" font-weight="600" text-anchor="middle">1</text><text x="374" y="147" font-size="16" fill="#164d50" font-weight="600" text-anchor="middle">0..N</text><path d="M542,236 L542,346" fill="none" stroke="#537577" stroke-width="1.8"/><text x="558" y="261" font-size="16" fill="#164d50" font-weight="600" text-anchor="start">1</text><text x="558" y="334" font-size="16" fill="#164d50" font-weight="600" text-anchor="start">0..N</text><rect x="18" y="82" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M24 82H292Q298 82 298 88V118H18V88Q18 82 24 82" fill="#164d50"/><text x="32" y="107" font-size="18" fill="white" font-weight="600" text-anchor="start">TaiKhoan</text><text x="32" y="142" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="32" y="165" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Email</text><text x="32" y="188" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">VaiTro</text><text x="32" y="211" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TrangThai</text><rect x="402" y="82" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M408 82H676Q682 82 682 88V118H402V88Q402 82 408 82" fill="#164d50"/><text x="416" y="107" font-size="18" fill="white" font-weight="600" text-anchor="start">HoSoBTC</text><text x="416" y="142" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="416" y="165" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TaiKhoanId  FK</text><text x="416" y="188" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TenToChuc</text><text x="416" y="211" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TrangThai</text><rect x="402" y="346" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M408 346H676Q682 346 682 352V382H402V352Q402 346 408 346" fill="#164d50"/><text x="416" y="371" font-size="18" fill="white" font-weight="600" text-anchor="start">GiayToBTC</text><text x="416" y="406" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="416" y="429" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">HoSoBTCId  FK</text><text x="416" y="452" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">LoaiGiayTo</text><text x="416" y="475" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">KhoaLuuTru</text><text x="18" y="544" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Một tài khoản có thể có nhiều hồ sơ BTC.</text><text x="18" y="569" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">HoSoBTC dùng Id làm PK, TaiKhoanId có thể lặp.</text><line x1="18" x2="682" y1="595" y2="595" stroke="#d5e2e1"/><text x="18" y="622" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">? = cho phép NULL   ·   UQ = duy nhất   ·   UQF = duy nhất có lọc</text></g></svg>