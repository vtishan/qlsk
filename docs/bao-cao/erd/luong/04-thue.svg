<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650"><title>Yêu cầu thuê và lịch địa điểm</title><desc>Sơ đồ quan hệ dữ liệu QLSK. Bội số đặt cạnh từng bảng. Các thuộc tính lấy từ lược đồ SQL Server.</desc><rect width="700" height="650" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><text x="18" y="30" font-size="22" fill="#164d50" font-weight="600" text-anchor="start">Yêu cầu thuê và lịch địa điểm</text><text x="18" y="57" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Trích lược đồ vật lý · PK / FK · số lượng tối thiểu..tối đa</text><path d="M298,160 L402,160" fill="none" stroke="#537577" stroke-width="1.8"/><text x="320" y="147" font-size="16" fill="#164d50" font-weight="600" text-anchor="middle">1</text><text x="374" y="147" font-size="16" fill="#164d50" font-weight="600" text-anchor="middle">0..N</text><path d="M542,236 L542,346" fill="none" stroke="#537577" stroke-width="1.8"/><text x="558" y="261" font-size="16" fill="#164d50" font-weight="600" text-anchor="start">0..1</text><text x="558" y="334" font-size="16" fill="#164d50" font-weight="600" text-anchor="start">0..N</text><path d="M298,424 L402,424" fill="none" stroke="#537577" stroke-width="1.8"/><text x="320" y="411" font-size="16" fill="#164d50" font-weight="600" text-anchor="middle">1</text><text x="374" y="411" font-size="16" fill="#164d50" font-weight="600" text-anchor="middle">0..N</text><rect x="18" y="82" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M24 82H292Q298 82 298 88V118H18V88Q18 82 24 82" fill="#164d50"/><text x="32" y="107" font-size="18" fill="white" font-weight="600" text-anchor="start">TaiKhoan</text><text x="32" y="142" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="32" y="165" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">HoTen</text><text x="32" y="188" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Email</text><text x="32" y="211" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">VaiTro</text><rect x="402" y="82" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M408 82H676Q682 82 682 88V118H402V88Q402 82 408 82" fill="#164d50"/><text x="416" y="107" font-size="18" fill="white" font-weight="600" text-anchor="start">YeuCauThue</text><text x="416" y="142" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="416" y="165" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TaiKhoanId  FK</text><text x="416" y="188" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">DiaDiemId  FK</text><text x="416" y="211" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TienCoc</text><rect x="18" y="346" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M24 346H292Q298 346 298 352V382H18V352Q18 346 24 346" fill="#164d50"/><text x="32" y="371" font-size="18" fill="white" font-weight="600" text-anchor="start">DiaDiem</text><text x="32" y="406" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="32" y="429" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TenDiaDiem</text><text x="32" y="452" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">GiaThue</text><text x="32" y="475" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TrangThai</text><rect x="402" y="346" width="280" height="154" rx="6" fill="white" stroke="#537577" stroke-width="1.5"/><path d="M408 346H676Q682 346 682 352V382H402V352Q402 346 408 346" fill="#164d50"/><text x="416" y="371" font-size="18" fill="white" font-weight="600" text-anchor="start">LichDatDiaDiem</text><text x="416" y="406" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Id  PK</text><text x="416" y="429" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">DiaDiemId  FK</text><text x="416" y="452" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">YeuCauThueId  FK?</text><text x="416" y="475" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">BatDau / KetThuc</text><text x="18" y="544" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">FK ghép của lịch giữ cùng địa điểm với hồ sơ thuê.</text><text x="18" y="569" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">YeuCauThue.DiaDiemId là FK bắt buộc; tiền cọc = 30%.</text><line x1="18" x2="682" y1="595" y2="595" stroke="#d5e2e1"/><text x="18" y="622" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">? = cho phép NULL   ·   UQ = duy nhất   ·   UQF = duy nhất có lọc</text></g></svg>