ill="#213a3d" font-weight="400" text-anchor="start">GiuGheId  FK?, UQF</text><text x="416" y="452" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">MaVe / MaQR  UQ</text><text x="416" y="475" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">TrangThai</text><text x="18" y="544" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">UQF: GiuGheId duy nhất khi khác NULL.</text><text x="18" y="569" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">Chỉ mục lọc giới hạn mỗi vé có một nhật ký ThanhCong.</text><line x1="18" x2="682" y1="595" y2="595" stroke="#d5e2e1"/><text x="18" y="622" font-size="16" fill="#213a3d" font-weight="400" text-anchor="start">? = cho phép NULL   ·   UQ = duy nhất   ·   UQF = duy nhất có lọc</text></g></svg>